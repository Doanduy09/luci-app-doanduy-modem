name: Build and Release IPK Package

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Package IPK & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Standard OpenWrt IPK Package
        run: |
          mkdir -p build_staging/data build_staging/control
          
          # Copy root files
          cp -r luci-app-doanduy-modem/root/* build_staging/data/
          
          # Copy htdocs into /www
          mkdir -p build_staging/data/www
          cp -r luci-app-doanduy-modem/htdocs/* build_staging/data/www/
          
          # Enforce proper execution permissions
          find build_staging/data -type d -exec chmod 755 {} +
          find build_staging/data -type f -exec chmod 644 {} +
          chmod 755 build_staging/data/usr/bin/* 2>/dev/null || true
          chmod 755 build_staging/data/usr/libexec/rpcd/* 2>/dev/null || true
          chmod 755 build_staging/data/etc/init.d/* 2>/dev/null || true
          chmod 755 build_staging/data/etc/uci-defaults/* 2>/dev/null || true
          chmod 755 build_staging/data/lib/netifd/proto/* 2>/dev/null || true
          
          # Control file
          cat << 'EOF' > build_staging/control/control
          Package: luci-app-doanduy-modem
          Version: 2.0.2-1
          Depends: luci-base, rpcd, ubus, jsonfilter, atinout
          Section: luci
          Architecture: all
          Maintainer: DOANDUY <doanduy09@gmail.com>
          Description: Quan Tri Modem 5G PCIe & USB, SMS Engine, Auto-Renew & AI Sentinel
          EOF
          
          # Conffiles
          cat << 'EOF' > build_staging/control/conffiles
          /etc/config/sentinel_bots.json
          /etc/config/sentinel_cameras.conf
          /etc/config/allowed_iccids.dat
          /etc/config/default_sim_iccid
          /etc/config/doanduy_vault
          /etc/config/doanduy_vault_multi.json
          /etc/config/telegram_bot.conf
          /etc/config/original_imei.dat
          /etc/config/adshield_status
          /etc/config/adshield_family
          /etc/config/adshield_custom.conf
          /etc/config/sms_custom_time.dat
          /etc/config/sms_renew_package.dat
          /etc/config/sms_renew_dest.dat
          /etc/config/tailscale_authkey
          /etc/config/tailscale_hostname
          /etc/config/gemini_api.key
          EOF
          
          # Post-installation script
          cat << 'EOF' > build_staging/control/postinst
          #!/bin/sh
          [ -n "$IPKG_INSTROOT" ] || {
              [ -x /etc/uci-defaults/99-luci-app-doanduy-modem ] && /bin/sh /etc/uci-defaults/99-luci-app-doanduy-modem && rm -f /etc/uci-defaults/99-luci-app-doanduy-modem
              rm -f /www/cgi-bin/sim_manager /usr/bin/wwan_smart_dialer.sh 2>/dev/null
              rm -f /tmp/luci-indexcache* 2>/dev/null
              rm -rf /tmp/luci-modulecache 2>/dev/null
              /etc/init.d/rpcd restart 2>/dev/null
              /etc/init.d/uhttpd restart 2>/dev/null
              exit 0
          }
          EOF
          chmod 755 build_staging/control/postinst
          find build_staging/control -type f ! -name "postinst" -exec chmod 644 {} +
          
          # Debian binary format
          echo "2.0" > build_staging/debian-binary
          
          # Pack archives
          tar -czf build_staging/data.tar.gz -C build_staging/data .
          tar -czf build_staging/control.tar.gz -C build_staging/control .
          
          # Pack final IPK
          tar -czf luci-app-doanduy-modem_2.0.2-1_all.ipk -C build_staging debian-binary control.tar.gz data.tar.gz
          
          ls -la luci-app-doanduy-modem_2.0.2-1_all.ipk

      - name: Upload IPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-doanduy-modem_2.0.2-1_all
          path: luci-app-doanduy-modem_2.0.2-1_all.ipk
          if-no-files-found: error

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v2.0.2"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists, uploading asset..."
            gh release upload "$TAG_NAME" luci-app-doanduy-modem_2.0.2-1_all.ipk --clobber
          else
            echo "Creating new release $TAG_NAME..."
            gh release create "$TAG_NAME" luci-app-doanduy-modem_2.0.2-1_all.ipk \
              --title "LuCI App DoanDuy Modem v2.0.2" \
              --notes "Release v2.0.1: Smart Adaptive TTL/Flow-Offload, carrier IPv6 MTU 1360 & FM350 default route, IPv6 NAT6 LAN, nested AT lock guard, deduplicated Clean DNS."
          fi
